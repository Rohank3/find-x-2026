services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: findx-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-findx}:${POSTGRES_PASSWORD:-findxpassword}@postgres:5432/${POSTGRES_DB:-findx_db}?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-findx_super_secret_session_encryption_key_change_in_prod}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-admin@iiitl.ac.in}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - findx-network

  postgres:
    image: postgres:16-alpine
    container_name: findx-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-findx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-findxpassword}
      POSTGRES_DB: ${POSTGRES_DB:-findx_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-findx} -d ${POSTGRES_DB:-findx_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - findx-network

  redis:
    image: redis:7-alpine
    container_name: findx-prod-redis
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - findx-network

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  findx-network:
    driver: bridge
